name: 二次元趣闻每日采集

on:
  schedule:
    # 每天北京时间 08:00 执行 (UTC 00:00)
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

# 权限：需要写入仓库权限来提交结果
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 检出代码 ──────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      # ── 设置 Python ──────────────────────────
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 安装依赖 ──────────────────────────────
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp
          # bilibili-api-python 可选（直接调用 API 时不需要）
          # pip install bilibili-api-python

      # ── 配置环境变量 ──────────────────────────
      - name: 创建 .env 文件
        working-directory: .
        run: |
          cat > .env << EOF
          MODELSCOPE_API_KEY=${{ secrets.MODELSCOPE_API_KEY }}
          NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          BILI_COOKIE=${{ secrets.BILI_COOKIE }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          EOF
          echo "✅ .env 已创建"
          # 验证 key 存在（不输出值）
          grep -q "MODELSCOPE_API_KEY=." .env && echo "  MODELSCOPE_API_KEY: ✓"
          grep -q "NOTION_TOKEN=." .env && echo "  NOTION_TOKEN: ✓"
          grep -q "NOTION_DATABASE_ID=." .env && echo "  NOTION_DATABASE_ID: ✓"
          grep -q "BILI_COOKIE" .env && echo "  BILI_COOKIE: ✓"
          grep -q "SUPABASE_URL" .env && echo "  SUPABASE_URL: ✓"
          grep -q "SUPABASE_KEY" .env && echo "  SUPABASE_KEY: ✓"

      # ── 运行采集管道 ──────────────────────────
      - name: 运行采集管道
        working-directory: .
        run: |
          echo "🚀 开始每日采集..."
          python3 run_pipeline.py 2>&1
        env:
          PYTHONUNBUFFERED: "1"

      # ── 生成 HTML 日报 ──────────────────────────
      - name: 生成 HTML 日报
        working-directory: .
        run: |
          python3 generate_report.py
          mkdir -p docs
          cp output/$(date +%Y-%m-%d)_report.html docs/index.html
          echo "✅ HTML 日报已生成"

      # ── 提交结果到仓库（使用 GitHub API）────────
      - name: 提交结果
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          
          # 检查 output 目录是否有文件
          if [ ! -d "output" ] || [ -z "$(ls -A output/ 2>/dev/null)" ]; then
            echo "⚠️ 没有输出文件，跳过提交"
            exit 0
          fi
          
          echo "📦 准备提交文件..."
          
          # 使用 git 提交到本地
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: ${TODAY} 每日采集更新 [skip ci]" || echo "没有变更"
          
          # 尝试 push（可能需要 PAT）
          if git push origin HEAD:master 2>/dev/null; then
            echo "✅ git push 成功"
          else
            echo "⚠️ git push 失败，尝试使用 PAT..."
            git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
            git push origin HEAD:master || echo "⚠️ PAT push 也失败，使用 API 上传..."
          fi

      # ── 上传产物（可选，保留 7 天） ──────────────
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output-${{ github.run_number }}
          path: scraper-data-2chibi/output/
          retention-days: 7
