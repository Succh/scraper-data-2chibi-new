name: 二次元趣闻每日采集

on:
  schedule:
    # 每天北京时间 08:00 执行 (UTC 00:00)
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

# 权限：需要写入仓库权限来提交结果
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 检出代码 ──────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      # ── 设置 Python ──────────────────────────
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 安装依赖 ──────────────────────────────
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp
          # bilibili-api-python 可选（直接调用 API 时不需要）
          # pip install bilibili-api-python

      # ── 配置环境变量 ──────────────────────────
      - name: 创建 .env 文件
        working-directory: .
        run: |
          cat > .env << EOF
          MODELSCOPE_API_KEY=${{ secrets.MODELSCOPE_API_KEY }}
          NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          BILI_COOKIE=${{ secrets.BILI_COOKIE }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          EOF
          echo "✅ .env 已创建"
          # 验证 key 存在（不输出值）
          grep -q "MODELSCOPE_API_KEY=." .env && echo "  MODELSCOPE_API_KEY: ✓"
          grep -q "NOTION_TOKEN=." .env && echo "  NOTION_TOKEN: ✓"
          grep -q "NOTION_DATABASE_ID=." .env && echo "  NOTION_DATABASE_ID: ✓"
          grep -q "BILI_COOKIE" .env && echo "  BILI_COOKIE: ✓"
          grep -q "SUPABASE_URL" .env && echo "  SUPABASE_URL: ✓"
          grep -q "SUPABASE_KEY" .env && echo "  SUPABASE_KEY: ✓"

      # ── 运行采集管道 ──────────────────────────
      - name: 运行采集管道
        working-directory: .
        run: |
          echo "🚀 开始每日采集..."
          python3 run_pipeline.py 2>&1
        env:
          PYTHONUNBUFFERED: "1"

      # ── 生成 HTML 日报 ──────────────────────────
      - name: 生成 HTML 日报
        working-directory: .
        run: |
          python3 generate_report.py
          mkdir -p docs
          cp output/$(date +%Y-%m-%d)_report.html docs/index.html
          echo "✅ HTML 日报已生成"

      # ── 提交结果到仓库 ──────────────────────────
      - name: 提交结果
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const today = new Date().toISOString().split('T')[0];
            const outputDir = 'output';
            const docsDir = 'docs';
            
            // 获取 output 目录的文件
            if (!fs.existsSync(outputDir)) {
              console.log('⚠️ output 目录不存在');
              return;
            }
            
            const files = fs.readdirSync(outputDir);
            if (files.length === 0) {
              console.log('⚠️ output 目录为空');
              return;
            }
            
            console.log(`📦 找到 ${files.length} 个文件`);
            
            // 提交每个文件
            for (const file of files) {
              const filePath = path.join(outputDir, file);
              const content = fs.readFileSync(filePath, 'base64');
              
              // 检查文件是否已存在
              let sha;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: `output/${file}`,
                });
                sha = data.sha;
              } catch (e) {
                // 文件不存在
              }
              
              // 创建或更新文件
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: `output/${file}`,
                message: `data: ${today} - ${file}`,
                content: content,
                sha: sha,
              });
              
              console.log(`✅ 已提交: output/${file}`);
            }
            
            // 提交 docs/index.html
            if (fs.existsSync(`${docsDir}/index.html`)) {
              const content = fs.readFileSync(`${docsDir}/index.html`, 'base64');
              let sha;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'docs/index.html',
                });
                sha = data.sha;
              } catch (e) {}
              
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'docs/index.html',
                message: `docs: ${today} HTML 日报`,
                content: content,
                sha: sha,
              });
              
              console.log('✅ 已提交: docs/index.html');
            }
            
            console.log('🎉 所有文件提交完成！');

      # ── 上传产物（可选，保留 7 天） ──────────────
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output-${{ github.run_number }}
          path: scraper-data-2chibi/output/
          retention-days: 7
